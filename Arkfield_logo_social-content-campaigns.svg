  <!-- Updated positioning lockup. -->
  <g fill="#102731">
    <text x="345" y="142" font-family="Montserrat, Avenir Next, Avenir, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="8">ARKFIELD</text>
    <text x="350" y="194" font-family="Montserrat, Avenir Next, Avenir, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="6.2">SOCIAL <tspan fill="#ff8a18">•</tspan> CONTENT <tspan fill="#ff8a18">•</tspan> CAMPAIGNS</text>
  </g>
