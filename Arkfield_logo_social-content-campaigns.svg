<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Arkfield</title>
  <desc id="description">Arkfield — Social, Content, Campaigns</desc>

  <defs>
    <linearGradient id="arkfield-teal-dark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00635f"/>
      <stop offset="1" stop-color="#008e95"/>
    </linearGradient>
    <linearGradient id="arkfield-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0798a3"/>
      <stop offset="1" stop-color="#006f73"/>
    </linearGradient>
    <linearGradient id="arkfield-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18ad80"/>
